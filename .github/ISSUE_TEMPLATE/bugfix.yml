name: Bug Report
description: 버그 리포트
labels: ["type:bugfix"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - agentops
        - shipkit
        - unity-game
        - infra
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: 무엇이 잘못되었는지
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 재현 단계
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 기대 동작
